  <main id="main" tabindex="-1">
    <div class="boot" id="boot"><div class="boot-keys"><span></span><span></span><span></span><span></span><span></span></div><p>Chargement de Piano Coach…</p></div>
  </main>
  <noscript><p class="card">Piano Coach a besoin de JavaScript pour fonctionner.</p></noscript>
  <script>
    // Écran d'erreur lisible plutôt qu'une page blanche si un module ne se charge pas (vieux navigateur, fichier manquant…)
    window.__bootFail = function (msg) {
      var m = document.getElementById('main');
      m.innerHTML = '<div class="card error" style="margin:24px auto;max-width:560px"><h2>Piano Coach n’a pas pu démarrer</h2>' +
        '<p>' + String(msg).replace(/[<>&]/g, '') + '</p><p>Vérifie que tu utilises une version récente de Chrome, Edge, Firefox ou Safari, puis recharge la page.</p>' +
        '<button class="btn primary" onclick="location.reload()">Recharger</button></div>';
    };
    window.addEventListener('error', function (e) { if (!window.__booted && e.message) window.__bootFail(e.message); });
    setTimeout(function () { if (!window.__booted) window.__bootFail('Le chargement prend trop de temps (connexion lente ou fichier manquant).'); }, 15000);
  </script>
  <script type="module">
    import('./js/app.js').then(function () { window.__booted = true; }).catch(function (e) { console.error(e); window.__bootFail(e && e.message || e); });
  </script>
  <script nomodule>window.__bootFail('Ce navigateur est trop ancien pour Piano Coach.');</script>
</body>
</html>
